<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Monitoring & Report Tool</title>
    <!-- Bootstrap 5 CDN Link -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4">
            
            <!-- Tool Header -->
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">MonitorX</h3>
                <p class="text-muted small">Sign in to access your dashboard</p>
            </div>

            <!-- Login Form -->
            <form action="/login" method="POST">
                
                <!-- Username Input -->
                <div class="mb-3">
                    <label for="username" class="form-label font-monospace small fw-bold">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                    <label for="password" class="form-label font-monospace small fw-bold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                    Sign In
                </button>

            </form>

        </div>
    </div>

    <!-- Bootstrap Bundle with Popper JS CDN (Useful later for dropdowns/alerts) -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
